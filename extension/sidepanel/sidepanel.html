<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtuozzo Application Management Assistant</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="context-bar">
    <div class="env-pill" id="env-pill" hidden>
      <span class="status-dot" id="env-status" title="running"></span>
      <code id="env-name">—</code>
    </div>
    <div class="host-label" id="host-label">AI Assistant</div>
    <div class="spacer"></div>
    <button class="icon-btn" id="btn-audit" title="What I changed">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="status-banner" id="status-banner" hidden></div>

  <main id="messages">
    <section id="empty-state">
      <h1 class="hero">What should we deploy?</h1>
      <p class="hero-sub">Deploy apps, add databases, scale, fix and explain — just say the word. I'll ask one question at a time and never change anything without your OK.</p>
      <div class="suggestions" id="suggestions">
        <button class="chip suggestion">🚀 Deploy my first app</button>
        <button class="chip suggestion">🐙 Deploy from GitHub</button>
        <button class="chip suggestion">🗄 Add a database</button>
        <button class="chip suggestion">⚡ Make my app faster</button>
        <button class="chip suggestion">🔒 Set up SSL</button>
        <button class="chip suggestion">🛡 Check my security</button>
        <button class="chip suggestion">📊 What's running?</button>
        <button class="chip suggestion">🔧 Fix something broken</button>
      </div>
    </section>
  </main>

  <footer class="composer">
    <div class="composer-box">
      <textarea id="input" rows="1" placeholder="Ask me anything — «deploy my app»… 🚀"
                aria-label="Message"></textarea>
      <button id="send" class="send-btn" title="Send (Enter)" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="composer-hint">Enter to send · Shift+Enter for a new line</div>
  </footer>

  <script src="../lib/api.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
